name: Sync Upstream Payloads

on:
  schedule:
    # Check for new releases every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  sync-payloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout custom-payloads repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run payload sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sync-payloads.py

      - name: Commit and push if changed
        run: |
          git config user.name "Release Bot"
          git config user.email "bot@github.com"
          git add payloads.json
          
          if git diff --cached --quiet; then
            echo "No changes detected"
          else
            git commit -m "chore: sync upstream payload releases"
            git push
          fi
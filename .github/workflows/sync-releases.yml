---
name: Sync Upstream Payloads

'on':
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

jobs:
  sync-payloads:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout custom-payloads repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure Git
        run: |
          git config user.name "Release Bot"
          git config user.email "bot@github.com"

      - name: Run payload sync script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/sync-payloads.py

      - name: Commit and push payloads.json if changed
        run: |
          git add payloads.json

          if git diff --cached --quiet; then
            echo "No changes to payloads.json"
          else
            git commit -m "chore: sync upstream payload releases"
            git push
          fi
